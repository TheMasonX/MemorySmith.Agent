name: CI

on:
  push:
    branches: [ "main", "master", "feature/**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MemorySmith.Agent.slnx

      - name: Build
        run: dotnet build MemorySmith.Agent.slnx --no-restore --configuration Release -p:CopilotSkipCliDownload=true

      - name: Test
        run: >
          dotnet test MemorySmith.Agent.slnx
          --no-build --configuration Release --verbosity normal -p:CopilotSkipCliDownload=true
          --collect:"XPlat Code Coverage" --results-directory artifacts/TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Secret scan
        run: pwsh ./Scripts/Invoke-SecretScan.ps1 -ScanAll -ReportPath artifacts/secret-scan-report.json
        shell: pwsh
        continue-on-error: true  # TSK-0349: report-only until baseline is clean

      - name: Upload secret scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-report
          path: artifacts/secret-scan-report.json

      - name: Validate task records
        run: pwsh ./Scripts/Test-TaskRecords.ps1
        shell: pwsh